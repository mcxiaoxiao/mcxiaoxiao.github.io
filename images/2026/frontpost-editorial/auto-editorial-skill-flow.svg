<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="900" viewBox="0 0 1540 900" role="img" aria-labelledby="title desc">
  <title id="title">FrontPost Skill 式自动采编流程</title>
  <desc id="desc">DeepAgent 通过一个总 Skill 顺序编排采集、归一、评分、证据补全、成稿、校验、人工批准、发布和投递，每步在对象存储写检查点并可独立重跑。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607981"/></marker>
    <style>
      .bg{fill:#f7f7f5}.box{fill:#fff;stroke:#c8d5d7;stroke-width:2}.code{fill:#e8f4f3;stroke:#8fbfbe;stroke-width:2}.ai{fill:#fbf3df;stroke:#c99b3b;stroke-width:2}.human{fill:#f9ebe6;stroke:#b75d46;stroke-width:2}.entry{fill:#1f3238;stroke:#1f3238;stroke-width:2}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.h{font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#465f66}.white{fill:#fff}.small{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#607981}.line{stroke:#607981;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#8ea3a8;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1540" height="900" rx="28"/>
  <text class="title" x="56" y="58">DeepAgent Skill 式例行采编：固定 runbook，子 Skill 可重跑</text>
  <text class="small" x="56" y="87">绿色 = 确定性代码优先　黄色 = AI 判断　红色 = 人工责任点　每一步结束都写检查点</text>

  <rect class="entry" x="56" y="132" width="250" height="108" rx="17"/>
  <text class="h white" x="82" y="171">frontpost.daily-editorial</text>
  <text class="small white" x="82" y="201">date · field · policy_version</text>
  <text class="small white" x="82" y="222">schedule / manual 共用入口</text>

  <rect class="code" x="365" y="120" width="240" height="132" rx="17"/>
  <text class="h" x="392" y="158">1. collect-sources</text>
  <text class="t" x="392" y="188">RSS + API + 趋势并行采集</text>
  <text class="small" x="392" y="216">输出 RawRecord + source stats</text>
  <text class="small" x="392" y="236">单源失败允许 partial</text>

  <rect class="code" x="664" y="120" width="240" height="132" rx="17"/>
  <text class="h" x="691" y="158">2. normalize-works</text>
  <text class="t" x="691" y="188">标识符归一、版本关联、去重</text>
  <text class="small" x="691" y="216">输出 canonical works</text>
  <text class="small" x="691" y="236">冲突关系进入待确认</text>

  <rect class="ai" x="963" y="120" width="240" height="132" rx="17"/>
  <text class="h" x="990" y="158">3. rank-candidates</text>
  <text class="t" x="990" y="188">规则评分 + 语义辅助</text>
  <text class="small" x="990" y="216">输出分项分数与理由</text>
  <text class="small" x="990" y="236">加入版面多样性约束</text>

  <rect class="code" x="1262" y="120" width="222" height="132" rx="17"/>
  <text class="h" x="1289" y="158">4. enrich-evidence</text>
  <text class="t" x="1289" y="188">摘要 / OA / 代码 / 引用</text>
  <text class="small" x="1289" y="216">只处理 Top N</text>
  <text class="small" x="1289" y="236">许可不足则降级</text>

  <path class="line" d="M306 186H365"/><path class="line" d="M605 186H664"/><path class="line" d="M904 186H963"/><path class="line" d="M1203 186H1262"/>

  <rect class="ai" x="1262" y="390" width="222" height="132" rx="17"/>
  <text class="h" x="1289" y="428">5. draft-edition</text>
  <text class="t" x="1289" y="458">基于证据生成结构化简报</text>
  <text class="small" x="1289" y="486">事实 / 归纳 / 判断分离</text>
  <text class="small" x="1289" y="506">不依赖前序模型上下文</text>

  <rect class="ai" x="963" y="390" width="240" height="132" rx="17"/>
  <text class="h" x="990" y="428">6. verify-edition</text>
  <text class="t" x="990" y="458">schema + 引用 + 风险检查</text>
  <text class="small" x="990" y="486">不通过 → needs_review</text>
  <text class="small" x="990" y="506">记录具体失败项</text>

  <rect class="human" x="664" y="390" width="240" height="132" rx="17"/>
  <text class="h" x="691" y="428">7. approve-edition</text>
  <text class="t" x="691" y="458">编辑通过、修订或退回</text>
  <text class="small" x="691" y="486">保存修改类型与原因</text>
  <text class="small" x="691" y="506">冻结 Edition revision</text>

  <rect class="code" x="365" y="390" width="240" height="132" rx="17"/>
  <text class="h" x="392" y="428">8. publish-edition</text>
  <text class="t" x="392" y="458">冻结 Edition + 渠道视图</text>
  <text class="small" x="392" y="486">一次生成，多渠道复用</text>
  <text class="small" x="392" y="506">revision 级幂等</text>

  <rect class="code" x="56" y="390" width="250" height="132" rx="17"/>
  <text class="h" x="83" y="428">9. deliver-edition</text>
  <text class="t" x="83" y="458">邮件 / MCP / Zotero / RSS / 首页</text>
  <text class="small" x="83" y="486">渠道独立重试</text>
  <text class="small" x="83" y="506">防重复投递</text>

  <path class="line" d="M1373 252V390"/><path class="line" d="M1262 456H1203"/><path class="line" d="M963 456H904"/><path class="line" d="M664 456H605"/><path class="line" d="M365 456H306"/>

  <rect class="box" x="150" y="650" width="1240" height="150" rx="20"/>
  <text class="h" x="183" y="690">每个 Skill 结束向对象存储写入持久化检查点</text>
  <text class="t" x="183" y="725">input refs　·　output refs　·　input/output hash　·　skill/policy/model version　·　耗时与成本　·　stats　·　warnings</text>
  <text class="t" x="183" y="759">失败后从当前节点恢复；确定性步骤可缓存；发布与投递使用业务幂等键；不保存或传递模型思维链。</text>
  <path class="dash" d="M770 650V566H1083V522"/>
  <path class="dash" d="M770 650V566H485V522"/>
</svg>
