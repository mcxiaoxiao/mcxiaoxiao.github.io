<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">FrontPost 采编反馈与优化闭环</title>
  <desc id="desc">运行、编辑、投递和阅读数据进入周度评测，形成版本化规则变更，经过回放和灰度后发布或回滚。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607981"/></marker>
    <style>
      .bg{fill:#f7f7f5}.box{fill:#fff;stroke:#c8d5d7;stroke-width:2}.soft{fill:#e8f4f3;stroke:#8fbfbe;stroke-width:2}.gold{fill:#fbf3df;stroke:#c99b3b;stroke-width:2}.brand{fill:#1f3238}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#465f66}.small{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#607981}.white{fill:#fff}.line{stroke:#607981;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="780" rx="28"/>
  <text class="title" x="56" y="62">用运行数据改 Skill，不凭感觉改总模型</text>
  <text class="small" x="56" y="90">每日看健康，周度做抽样评测，月度版本化上线；所有变化可回放、可灰度、可回滚</text>

  <rect class="box" x="70" y="150" width="260" height="380" rx="20"/>
  <text class="h" x="100" y="190">观测数据</text>
  <text class="t" x="100" y="232">来源健康</text><text class="small" x="100" y="257">成功率 · 429 · 延迟 · 缺失率</text>
  <text class="t" x="100" y="297">编辑反馈</text><text class="small" x="100" y="322">接受率@K · 退回 · 修正类型</text>
  <text class="t" x="100" y="362">证据质量</text><text class="small" x="100" y="387">引用覆盖 · 冲突 · 许可状态</text>
  <text class="t" x="100" y="427">用户行为</text><text class="small" x="100" y="452">读完 · 收藏 · 不相关 · 退订</text>
  <text class="t" x="100" y="492">成本与时延</text><text class="small" x="100" y="517">每篇成本 · 端到端发布时间</text>

  <rect class="soft" x="410" y="205" width="260" height="270" rx="20"/>
  <text class="h" x="440" y="245">固定评测与问题归因</text>
  <text class="t" x="440" y="285">历史时间窗回放</text>
  <text class="t" x="440" y="321">每周 30–50 个候选抽样</text>
  <text class="t" x="440" y="357">区分来源 / 规则 / 模板问题</text>
  <text class="t" x="440" y="393">查看分项指标，不只看点击</text>
  <text class="small" x="440" y="435">产出一份可复现的变更假设</text>

  <rect class="gold" x="750" y="205" width="260" height="270" rx="20"/>
  <text class="h" x="780" y="245">版本化变更</text>
  <text class="t" x="780" y="285">来源优先级与限速</text>
  <text class="t" x="780" y="321">评分权重与阈值</text>
  <text class="t" x="780" y="357">去重规则与证据模板</text>
  <text class="t" x="780" y="393">Skill / prompt / model 版本</text>
  <text class="small" x="780" y="435">一次只改少量变量，保留 diff</text>

  <rect class="brand" x="1090" y="205" width="280" height="270" rx="20"/>
  <text class="h white" x="1120" y="245">回放 → 灰度 → 发布</text>
  <text class="t white" x="1120" y="285">1. 固定样本不退化</text>
  <text class="t white" x="1120" y="321">2. 内部 Edition 对比</text>
  <text class="t white" x="1120" y="357">3. 单领域小流量灰度</text>
  <text class="t white" x="1120" y="393">4. 发布或一键回滚</text>
  <text class="small white" x="1120" y="435">历史 Edition 保持原版本</text>

  <path class="line" d="M330 340H410"/><path class="line" d="M670 340H750"/><path class="line" d="M1010 340H1090"/>
  <path class="line" d="M1230 475V625H200V530"/>
  <text class="small" x="570" y="660">新版本产生的新运行数据重新进入观测；失败时回滚版本，不修改历史内容</text>
</svg>
