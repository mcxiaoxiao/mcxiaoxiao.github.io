<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">FrontPost 自动采编运行架构</title>
  <desc id="desc">定时器或 assistant-ui 启动 DeepAgent，DeepAgent 调用 Skill 和来源适配器，将运行工件写入对象存储，经人工审核后向邮件、MCP、Zotero、RSS 和个人推荐首页推送一致内容。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#557078"/></marker>
    <style>
      .bg{fill:#f7f7f5}.panel{fill:#fff;stroke:#cbd6d7;stroke-width:2}.brand{fill:#1f3238}.soft{fill:#e8f4f3;stroke:#8fbfbe;stroke-width:2}.gold{fill:#fbf3df;stroke:#c99b3b;stroke-width:2}.warn{fill:#f9ebe6;stroke:#b75d46;stroke-width:2}.title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.h{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.t{font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#375159}.small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#557078}.white{fill:#fff}.line{stroke:#557078;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#8aa0a5;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1440" height="820" rx="28"/>
  <text class="title" x="60" y="62">FrontPost 自动采编运行架构</text>
  <text class="small" x="60" y="90">DeepAgent + assistant-ui + 版本化 Skill + 对象存储；模型不承担隐藏流程控制</text>

  <rect class="panel" x="60" y="130" width="220" height="230" rx="18"/>
  <text class="h" x="88" y="170">触发器</text>
  <rect class="soft" x="88" y="192" width="164" height="40" rx="10"/><text class="t" x="115" y="218">定时 Scheduler</text>
  <rect class="soft" x="88" y="244" width="164" height="40" rx="10"/><text class="t" x="111" y="270">assistant-ui 手动运行</text>
  <rect class="soft" x="88" y="296" width="164" height="40" rx="10"/><text class="t" x="117" y="322">Focus 事件触发</text>

  <rect class="brand" x="350" y="130" width="270" height="230" rx="18"/>
  <text class="h white" x="380" y="170">DeepAgent Runtime</text>
  <text class="t white" x="380" y="205">frontpost.daily-editorial</text>
  <text class="small white" x="380" y="240">• LangGraph durable execution</text>
  <text class="small white" x="380" y="270">• Skill / tools / interrupts</text>
  <text class="small white" x="380" y="300">• assistant-ui 流式状态与审批</text>
  <text class="small white" x="380" y="330">• 固定日更 runbook</text>

  <rect class="panel" x="690" y="130" width="320" height="230" rx="18"/>
  <text class="h" x="720" y="170">Skill Workers</text>
  <text class="t" x="720" y="207">采集 · 归一 · 评分 · 证据补全</text>
  <text class="t" x="720" y="241">成稿 · 校验 · 发布 · 投递</text>
  <rect class="gold" x="720" y="270" width="260" height="62" rx="12"/>
  <text class="t" x="742" y="296">TaskIQ + Redis 队列</text>
  <text class="small" x="742" y="318">按任务类型扩容，不占用 API worker</text>

  <rect class="panel" x="1080" y="130" width="300" height="230" rx="18"/>
  <text class="h" x="1110" y="170">来源适配器</text>
  <text class="t" x="1110" y="207">RSS / Atom：增量发现</text>
  <text class="t" x="1110" y="239">Search API：回看与补全</text>
  <text class="t" x="1110" y="271">HF / GitHub：趋势信号</text>
  <text class="t" x="1110" y="303">开放全文：许可后处理</text>
  <text class="small" x="1110" y="332">每个来源独立限速与失败</text>

  <path class="line" d="M280 245H350"/>
  <path class="line" d="M620 245H690"/>
  <path class="line" d="M1010 245H1080"/>

  <rect class="panel" x="350" y="440" width="420" height="220" rx="18"/>
  <text class="h" x="380" y="482">Object Storage：采编事实层</text>
  <text class="t" x="380" y="520">raw / works / runs / editions / feedback</text>
  <text class="t" x="380" y="552">来源快照 / Skill checkpoint / 渠道 manifest</text>
  <text class="t" x="380" y="584">内容哈希 / 评分理由 / 引用证据 / revision</text>
  <text class="small" x="380" y="624">数据库仅保留用户、权限、Focus 与检索索引</text>

  <rect class="warn" x="840" y="440" width="230" height="220" rx="18"/>
  <text class="h" x="870" y="482">编辑审核</text>
  <text class="t" x="870" y="520">证据与许可检查</text>
  <text class="t" x="870" y="552">批准 / 退回 / 修订</text>
  <text class="t" x="870" y="584">assistant-ui 批准 interrupt</text>
  <text class="small" x="870" y="624">MVP 官方推送必须人审</text>

  <rect class="brand" x="1140" y="440" width="240" height="220" rx="18"/>
  <text class="h white" x="1170" y="482">发布与送达</text>
  <text class="t white" x="1170" y="520">邮件 · MCP · Zotero</text>
  <text class="t white" x="1170" y="552">RSS · 个人推荐首页</text>
  <text class="t white" x="1170" y="584">Web / Markdown 归档</text>
  <text class="small white" x="1170" y="624">同一 Edition revision</text>

  <path class="line" d="M850 360V405H560V440"/>
  <path class="dash" d="M560 440V390H955V440"/>
  <path class="line" d="M770 550H840"/>
  <path class="line" d="M1070 550H1140"/>
  <path class="dash" d="M1260 660V730H560V660"/>
  <text class="small" x="772" y="758">投递与阅读反馈回写，供下一轮规则评估</text>
</svg>
