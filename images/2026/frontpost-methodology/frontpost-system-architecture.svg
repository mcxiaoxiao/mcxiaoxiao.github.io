<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FrontPost 四层系统架构</title>
  <desc id="desc">产品与交付、产品服务与任务编排、内容生产、数据基础设施四层及其关键组件。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f5}.band{fill:#fff;stroke:#cbd3ce;stroke-width:2}.blue{fill:#dceef8;stroke:#0072b2}.green{fill:#dff3ea;stroke:#009e73}.orange{fill:#fff0d2;stroke:#e69f00}.gray{fill:#edf0ee;stroke:#6d7973}.dark{fill:#17231e}.title{font:700 34px Arial,'Noto Sans SC',sans-serif;fill:#17231e}.label{font:700 22px Arial,'Noto Sans SC',sans-serif;fill:#17231e}.text{font:500 18px Arial,'Noto Sans SC',sans-serif;fill:#27352f}.small{font:500 16px Arial,'Noto Sans SC',sans-serif;fill:#64716b}.white{fill:#fff}.line{stroke:#74817b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#74817b"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="70" y="65">FrontPost 四层系统架构</text>
  <text class="small" x="70" y="95">同一套 Conversation、Run、Work、Markdown 与 Delivery 模型支撑公开内容和个人内容</text>

  <rect class="band" x="70" y="130" width="1460" height="145" rx="20"/>
  <text class="label" x="100" y="170">1　产品与交付</text>
  <rect class="blue" x="100" y="192" width="290" height="52" rx="12"/><text class="text" x="144" y="225">Web · Expo · Reader</text>
  <rect class="blue" x="420" y="192" width="290" height="52" rx="12"/><text class="text" x="484" y="225">Search · Ask</text>
  <rect class="blue" x="740" y="192" width="360" height="52" rx="12"/><text class="text" x="789" y="225">公开首页 · 个人工作区</text>
  <rect class="blue" x="1130" y="192" width="350" height="52" rx="12"/><text class="text" x="1182" y="225">Email · RSS · MCP · Zotero</text>

  <path class="line" d="M800 275 L800 310"/>
  <rect class="band" x="70" y="315" width="1460" height="155" rx="20"/>
  <text class="label" x="100" y="355">2　产品服务与任务编排</text>
  <rect class="green" x="100" y="380" width="245" height="54" rx="12"/><text class="text" x="139" y="414">Better Auth</text>
  <rect class="green" x="370" y="380" width="245" height="54" rx="12"/><text class="text" x="420" y="414">FastAPI</text>
  <rect class="green" x="640" y="380" width="280" height="54" rx="12"/><text class="text" x="686" y="414">assistant-ui</text>
  <rect class="green" x="945" y="380" width="280" height="54" rx="12"/><text class="text" x="985" y="414">DeepAgent · Skills</text>
  <rect class="green" x="1250" y="380" width="230" height="54" rx="12"/><text class="text" x="1291" y="414">Scheduler · TaskIQ</text>

  <path class="line" d="M800 470 L800 505"/>
  <rect class="band" x="70" y="510" width="1460" height="155" rx="20"/>
  <text class="label" x="100" y="550">3　内容生产</text>
  <rect class="orange" x="100" y="575" width="250" height="54" rx="12"/><text class="text" x="139" y="609">来源发现 · Work 归一</text>
  <rect class="orange" x="375" y="575" width="250" height="54" rx="12"/><text class="text" x="422" y="609">全局质量评估</text>
  <rect class="orange" x="650" y="575" width="250" height="54" rx="12"/><text class="text" x="697" y="609">最近七天公共池</text>
  <rect class="orange" x="925" y="575" width="250" height="54" rx="12"/><text class="text" x="962" y="609">个人检索与排序</text>
  <rect class="orange" x="1200" y="575" width="280" height="54" rx="12"/><text class="text" x="1243" y="609">Markdown · Edition · 渲染</text>

  <path class="line" d="M800 665 L800 700"/>
  <rect class="band" x="70" y="705" width="1460" height="135" rx="20"/>
  <text class="label" x="100" y="745">4　数据基础设施</text>
  <rect class="dark" x="100" y="767" width="420" height="48" rx="12"/><text class="text white" x="140" y="798">PostgreSQL　业务、时序与幂等状态</text>
  <rect class="gray" x="590" y="767" width="420" height="48" rx="12"/><text class="text" x="633" y="798">对象存储　来源、Markdown 与 manifest</text>
  <rect class="gray" x="1080" y="767" width="400" height="48" rx="12"/><text class="text" x="1130" y="798">Redis　Worker 队列、结果与短锁</text>
</svg>
