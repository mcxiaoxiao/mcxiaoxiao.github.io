<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">FrontPost 系统总架构</title>
  <desc id="desc">FrontPost 从用户入口经过产品服务、统一 AI 运行时和内容生产系统，使用 PostgreSQL、对象存储与 Redis，最终向 Web、邮件、RSS、MCP 和 Zotero 交付一致内容。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#587078"/></marker>
    <style>
      .bg{fill:#f7f7f5}.panel{fill:#fff;stroke:#c9d5d7;stroke-width:2}.dark{fill:#1f3238;stroke:#1f3238;stroke-width:2}.teal{fill:#e8f4f3;stroke:#8fbfbe;stroke-width:2}.gold{fill:#fbf3df;stroke:#c99b3b;stroke-width:2}.rose{fill:#f9ebe6;stroke:#b75d46;stroke-width:2}.title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.h{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#1f3238}.t{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#3c565d}.small{font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;fill:#61777d}.white{fill:#fff}.line{stroke:#587078;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#8ca0a5;stroke-width:2;stroke-dasharray:7 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="980" rx="28"/>
  <text class="title" x="55" y="60">FrontPost 系统总架构</text>
  <text class="small" x="55" y="88">用户产品、统一 AI、内容生产、数据基础设施与多渠道交付共享同一领域模型</text>

  <rect class="panel" x="55" y="125" width="1490" height="125" rx="18"/>
  <text class="h" x="82" y="158">用户与操作界面</text>
  <rect class="teal" x="82" y="178" width="245" height="48" rx="11"/><text class="t" x="107" y="208">公开首页 · 领域邮报 · 搜索</text>
  <rect class="teal" x="350" y="178" width="245" height="48" rx="11"/><text class="t" x="385" y="208">Reader · 收藏 · 批注</text>
  <rect class="gold" x="618" y="178" width="245" height="48" rx="11"/><text class="t" x="659" y="208">Ask · Track · Focus</text>
  <rect class="gold" x="886" y="178" width="245" height="48" rx="11"/><text class="t" x="912" y="208">assistant-ui 运行与证据视图</text>
  <rect class="rose" x="1154" y="178" width="360" height="48" rx="11"/><text class="t" x="1221" y="208">编辑控制台 · 审批 · 运行监控</text>

  <rect class="panel" x="55" y="290" width="1490" height="130" rx="18"/>
  <text class="h" x="82" y="325">产品与领域服务</text>
  <rect class="dark" x="82" y="345" width="220" height="50" rx="11"/><text class="t white" x="130" y="376">Better Auth · 权限</text>
  <rect class="teal" x="325" y="345" width="220" height="50" rx="11"/><text class="t" x="367" y="376">FastAPI · Product API</text>
  <rect class="teal" x="568" y="345" width="220" height="50" rx="11"/><text class="t" x="616" y="376">Track · Search · Reader</text>
  <rect class="teal" x="811" y="345" width="220" height="50" rx="11"/><text class="t" x="859" y="376">Work · Evidence · Ask</text>
  <rect class="teal" x="1054" y="345" width="220" height="50" rx="11"/><text class="t" x="1097" y="376">Edition · Subscription</text>
  <rect class="teal" x="1297" y="345" width="217" height="50" rx="11"/><text class="t" x="1342" y="376">Feedback · Delivery</text>

  <rect class="panel" x="55" y="460" width="1490" height="145" rx="18"/>
  <text class="h" x="82" y="495">统一 AI 与任务运行时</text>
  <rect class="dark" x="82" y="518" width="280" height="58" rx="12"/><text class="h white" x="130" y="553">DeepAgent / LangGraph</text>
  <rect class="gold" x="400" y="518" width="260" height="58" rx="12"/><text class="t" x="456" y="553">版本化 Skills 与 Tools</text>
  <rect class="gold" x="698" y="518" width="260" height="58" rx="12"/><text class="t" x="753" y="553">检索 · 比较 · 综合 · 校验</text>
  <rect class="rose" x="996" y="518" width="235" height="58" rx="12"/><text class="t" x="1042" y="553">Interrupt · 人工责任点</text>
  <rect class="teal" x="1269" y="518" width="245" height="58" rx="12"/><text class="t" x="1321" y="553">TaskIQ 异步执行池</text>

  <rect class="panel" x="55" y="645" width="1490" height="140" rx="18"/>
  <text class="h" x="82" y="680">内容生产与交付</text>
  <rect class="teal" x="82" y="704" width="240" height="54" rx="11"/><text class="t" x="128" y="737">RSS · API · Trending</text>
  <rect class="gold" x="348" y="704" width="280" height="54" rx="11"/><text class="t" x="393" y="737">采集 · 归一 · 证据 · 排序</text>
  <rect class="gold" x="654" y="704" width="250" height="54" rx="11"/><text class="t" x="702" y="737">成稿 · 校验 · 人审</text>
  <rect class="dark" x="930" y="704" width="220" height="54" rx="11"/><text class="t white" x="973" y="737">冻结 Edition revision</text>
  <rect class="teal" x="1176" y="704" width="338" height="54" rx="11"/><text class="t" x="1224" y="737">Web · Email · RSS · MCP · Zotero</text>
  <path class="line" d="M322 731H348"/><path class="line" d="M628 731H654"/><path class="line" d="M904 731H930"/><path class="line" d="M1150 731H1176"/>

  <rect class="panel" x="55" y="825" width="1490" height="105" rx="18"/>
  <text class="h" x="82" y="860">数据与基础设施</text>
  <text class="t" x="82" y="895">PostgreSQL：身份、偏好、Track、权限、索引</text>
  <text class="t" x="540" y="895">对象存储：raw、works、runs、evidence、editions、delivery manifests</text>
  <text class="t" x="1250" y="895">Redis：队列、锁、短期缓存</text>

  <path class="line" d="M800 250V290"/><path class="line" d="M800 420V460"/><path class="line" d="M800 605V645"/><path class="line" d="M800 785V825"/>
  <path class="dash" d="M1450 758V952H170V250"/>
  <text class="small" x="550" y="960">阅读、收藏、追问、退订与编辑反馈回写 Track、排序规则和 Skill 评测</text>
</svg>
