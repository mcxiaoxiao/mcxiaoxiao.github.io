<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FrontPost 公共与个人内容运行</title>
  <desc id="desc">公共自动采编生成最近七天内容池，个人运行复用公共内容并执行专项搜索，最终组装和投递。</desc>
  <defs>
    <style>
      .bg{fill:#f7f8f5}.panel{fill:#fff;stroke:#cbd3ce;stroke-width:2}.blue{fill:#dceef8;stroke:#0072b2;stroke-width:2}.green{fill:#dff3ea;stroke:#009e73;stroke-width:2}.orange{fill:#fff0d2;stroke:#e69f00;stroke-width:2}.dark{fill:#17231e}.title{font:700 34px Arial,'Noto Sans SC',sans-serif;fill:#17231e}.lane{font:700 22px Arial,'Noto Sans SC',sans-serif;fill:#17231e}.text{font:600 18px Arial,'Noto Sans SC',sans-serif;fill:#27352f}.small{font:500 16px Arial,'Noto Sans SC',sans-serif;fill:#64716b}.white{fill:#fff}.arrow{stroke:#69766f;stroke-width:3;fill:none;marker-end:url(#end)}
    </style>
    <marker id="end" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#69766f"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="70" y="65">FrontPost 公共内容池与个人生成</text>
  <text class="small" x="70" y="95">公共质量只计算一次；个人 Run 新增相关性并执行 Focus 专项搜索</text>

  <rect class="panel" x="70" y="135" width="1460" height="260" rx="22"/>
  <text class="lane" x="100" y="180">公共自动采编</text>
  <rect class="blue" x="100" y="220" width="250" height="82" rx="14"/><text class="text" x="146" y="255">六个大领域</text><text class="small" x="132" y="281">二十二个细分领域</text>
  <path class="arrow" d="M350 261 L410 261"/>
  <rect class="blue" x="410" y="220" width="250" height="82" rx="14"/><text class="text" x="449" y="255">来源发现 · 归一</text><text class="small" x="468" y="281">News / Paper</text>
  <path class="arrow" d="M660 261 L720 261"/>
  <rect class="blue" x="720" y="220" width="250" height="82" rx="14"/><text class="text" x="762" y="255">资格门槛 · 质量</text><text class="small" x="762" y="281">全局评分与依据</text>
  <path class="arrow" d="M970 261 L1030 261"/>
  <rect class="dark" x="1030" y="205" width="270" height="112" rx="16"/><text class="text white" x="1081" y="249">最近七天公共池</text><text class="small white" x="1066" y="278">分日期 · 领域 · 语言</text>
  <path class="arrow" d="M1300 261 L1360 261"/>
  <rect class="green" x="1360" y="220" width="140" height="82" rx="14"/><text class="text" x="1384" y="255">公开首页</text><text class="small" x="1382" y="281">按质量选稿</text>

  <path class="arrow" d="M1165 317 L1165 462"/>
  <rect class="panel" x="70" y="455" width="1460" height="330" rx="22"/>
  <text class="lane" x="100" y="500">个人 Conversation / Run</text>
  <rect class="orange" x="100" y="555" width="220" height="84" rx="14"/><text class="text" x="147" y="590">用户 Focus</text><text class="small" x="125" y="616">显式约束优先</text>
  <path class="arrow" d="M320 597 L375 597"/>
  <rect class="orange" x="375" y="540" width="240" height="114" rx="14"/><text class="text" x="426" y="580">公共池召回</text><text class="small" x="416" y="608">Conversation memory</text><text class="small" x="422" y="632">收藏与阅读反馈</text>
  <path class="arrow" d="M615 597 L670 597"/>
  <rect class="orange" x="670" y="555" width="220" height="84" rx="14"/><text class="text" x="712" y="590">Focus 专项搜索</text><text class="small" x="707" y="616">合并与 Work 去重</text>
  <path class="arrow" d="M890 597 L945 597"/>
  <rect class="orange" x="945" y="540" width="250" height="114" rx="14"/><text class="text" x="990" y="580">个人综合排序</text><text class="small" x="981" y="608">65% 相关性 + 35% 质量</text><text class="small" x="984" y="632">公共内容按需补齐</text>
  <path class="arrow" d="M1195 597 L1250 597"/>
  <rect class="dark" x="1250" y="540" width="250" height="114" rx="14"/><text class="text white" x="1294" y="580">多份 Markdown</text><text class="small white" x="1283" y="608">Edition manifest</text><text class="small white" x="1277" y="632">Web · Email · RSS 等</text>

  <path class="arrow" d="M780 639 L780 720 L1120 720 L1120 654"/>
  <text class="small" x="805" y="712">新发现可进入公共候选队列，移除用户上下文后生成公共稿</text>
  <text class="small" x="70" y="835">定时 Run 由 PostgreSQL 保存时序事实，Scheduler 抢占到期规则后写入 Redis；Delivery 在 manifest 完成后创建。</text>
</svg>
